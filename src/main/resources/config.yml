# Конфигурация Биржи Праймов

# Базовый курс обмена (1 коин = X праймов)
base-rate: 400000.0

# Волатильность курса (насколько сильно влияют заявки на курс)
# 0.05 = 5% изменение курса на каждую дополнительную заявку
volatility: 0.05

# Минимальный курс (защита от слишком низкого курса)
min-rate: 100000.0

# Балансы праймов игроков (автоматически заполняется)
praims: {}

# Балансы коинов игроков (автоматически заполняется)
coins: {}